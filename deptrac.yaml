deptrac:
  paths:
    - ./src
  layers:
    - name: Internal
      collectors:
        - type: directory
          value: src/Internal/.*
    - name: Validator
      collectors:
        - type: directory
          value: src/Validator/.*
    - name: Behavior
      collectors:
        - type: directory
          value: src/Behavior/.*
  ruleset:
    # The core and Yii are not declared as layers. The validator (request input)
    # and the behavior (storage) never see each other; Internal holds what both
    # must agree on (the JSON form of a composite).
    Internal: ~
    Validator:
      - Internal
    Behavior:
      - Internal
