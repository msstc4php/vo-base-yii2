deptrac:
  paths:
    - ./src
  layers:
    - name: Internal
      collectors:
        - type: directory
          value: src/Internal/.*
    - name: Validator
      collectors:
        - type: directory
          value: src/Validator/.*
    - name: Behavior
      collectors:
        - type: directory
          value: src/Behavior/.*
    - name: Web
      collectors:
        - type: directory
          value: src/Web/.*
    - name: Model
      collectors:
        - type: directory
          value: src/Model/.*
  ruleset:
    # The core and Yii are not declared as layers. The validator (request input)
    # and the behavior (storage) never see each other; Internal holds what they
    # must agree on (the JSON form of a composite, the client-facing type label).
    # Model reads what the validator rule declares.
    Internal: ~
    Validator:
      - Internal
    Behavior:
      - Internal
    Web:
      - Internal
    Model:
      - Internal
      - Validator
